apiVersion: apps/v1

kind: Deployment

metadata:
  name: frontend
  namespace: task-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
        - name: frontend

          image: 273366118364.dkr.ecr.ap-south-1.amazonaws.com/task-frontend:v1

          ports:
            - containerPort: 80

