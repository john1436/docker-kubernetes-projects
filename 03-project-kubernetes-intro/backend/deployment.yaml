apiVersion: apps/v1

kind: Deployment

metadata:
  name: backend
  namespace: task-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
        - name: backend

          image: 273366118364.dkr.ecr.ap-south-1.amazonaws.com/task-backend:v1

          ports:
            - containerPort: 5000

          envFrom:
            - configMapRef:
                name: backend-config

            - secretRef:
                name: backend-secret
